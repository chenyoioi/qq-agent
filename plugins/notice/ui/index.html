<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>群通知</title>
<style>
  :root { color-scheme: light dark; --bg:#f7f8fa; --card:#fff; --line:#e3e6ec; --text:#1f2329; --muted:#6b7280; --accent:#2f6fed; --ok:#0f7a3d; --warn:#d33; }
  @media (prefers-color-scheme: dark) { :root { --bg:#15171c; --card:#1d2027; --line:#2c313b; --text:#e6e8ec; --muted:#9aa3b2; --accent:#6ea0ff; --ok:#4ac26b; --warn:#ff7b72; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; font:13px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background:var(--bg); color:var(--text); }
  h2 { font-size:15px; margin:0 0 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  input, select, textarea, button { font:inherit; color:inherit; background:transparent; border:1px solid var(--line); border-radius:7px; padding:6px 9px; }
  textarea { width:100%; min-height:130px; resize:vertical; line-height:1.7; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-size:12px; }
  .muted { color:var(--muted); } .ok { color:var(--ok); } .warn { color:var(--warn); }
  .hint { font-size:12px; color:var(--muted); }
  .preview { white-space:pre-wrap; border:1px dashed var(--line); border-radius:8px; padding:10px; margin-top:8px; }
</style>
</head>
<body>
<div class="card">
  <div class="row" style="justify-content:space-between">
    <h2>发群通知（@全员）</h2>
    <div class="row">
      <select id="chatSel" style="max-width:200px"></select>
      <input id="chatId" placeholder="手动填群号" style="width:130px" />
    </div>
  </div>
  <div style="margin-top:10px">
    <textarea id="content" placeholder="通知内容，可多行。例如：&#10;今晚 21:00 群内点名，没到的踢出&#10;本周末拍车活动报名截止周六中午"></textarea>
  </div>
  <div class="row" style="margin-top:8px">
    <label class="row" style="gap:4px"><input type="checkbox" id="atAll" checked /><span class="muted">@全员</span></label>
    <button class="primary" id="send">发送</button>
    <span class="hint" id="status"></span>
  </div>
  <div class="preview" id="preview"></div>
  <div class="hint" style="margin-top:6px">群里也可以直接跟机器人说：<code>通知 今晚 21 点开会</code>（只有主人 QQ 有效）。</div>
</div>

<div class="card">
  <div class="row" style="justify-content:space-between"><strong>发送记录</strong><span class="hint" id="count"></span></div>
  <table>
    <thead><tr><th>时间</th><th>来源</th><th>@全员</th><th>内容</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const KEY = 'notice-panel-chat';
const scope = () => { const id = String($('#chatId').value || '').replace(/\D/g, ''); return id ? `group:${id}` : ''; };

async function call(action, payload = {}) {
  const r = await fetch('/api/plugin-ui/notice/action', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ action, payload: { chatKey: scope(), ...payload } })
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}

function renderPreview() {
  const text = $('#content').value.trim();
  $('#preview').textContent = (text ? `📢 群通知\n${text}` : '（上面写内容，这里预览实际发出去的样子）');
}

async function loadList() {
  if (!scope()) { $('#status').textContent = '先选择或填写群号'; return; }
  try {
    const d = await call('list');
    if (!d.ok) { $('#status').textContent = '读取失败：' + (d.error || ''); return; }
    $('#rows').innerHTML = (d.rows || []).map((r) => `
      <tr>
        <td class="muted">${new Date(r.at).toLocaleString('zh-CN')}</td>
        <td class="muted">${r.from === 'console' ? '控制台' : '群里'}</td>
        <td>${r.atAll ? '是' : '否'}</td>
        <td style="white-space:pre-wrap">${esc(r.content)}</td>
      </tr>`).join('') || '<tr><td colspan="4" class="muted">这个群还没发过通知</td></tr>';
    $('#count').textContent = `共 ${(d.rows || []).length} 条`;
  } catch (e) { $('#status').textContent = '读取失败：' + e.message; }
}

$('#send').addEventListener('click', async () => {
  const text = $('#content').value.trim();
  const out = $('#status');
  if (!text) { out.className = 'hint warn'; out.textContent = '内容不能为空'; return; }
  if (!confirm(`确认给 ${$('#chatId').value} 发通知？${$('#atAll').checked ? '（会 @全员）' : ''}`)) return;
  out.className = 'hint'; out.textContent = '发送中…';
  try {
    const r = await call('send', { text, atAll: $('#atAll').checked });
    if (!r.ok) { out.className = 'hint warn'; out.textContent = '发送失败：' + (r.error || ''); return; }
    out.className = 'hint ok'; out.textContent = `已发送（消息 id ${r.messageId ?? '未知'}）`;
    $('#content').value = '';
    renderPreview();
    loadList();
  } catch (e) { out.className = 'hint warn'; out.textContent = '发送失败：' + e.message; }
});

$('#content').addEventListener('input', renderPreview);
$('#refresh')?.addEventListener('click', loadList);

async function initChat() {
  const saved = localStorage.getItem(KEY) || '';
  let groups = [];
  try { const cfg = await (await fetch('/api/config')).json(); groups = (cfg.allow?.groups || []).filter(Boolean); } catch {}
  $('#chatSel').innerHTML = ['<option value="">（选择群）</option>'].concat(groups.map((g) => `<option value="${esc(g)}">${esc(g)}</option>`)).join('');
  if (saved) $('#chatId').value = saved; else if (groups.length) $('#chatId').value = groups[0];
  if (groups.includes($('#chatId').value)) $('#chatSel').value = $('#chatId').value;
  localStorage.setItem(KEY, $('#chatId').value.trim());
}

$('#chatSel').addEventListener('change', () => { if ($('#chatSel').value) { $('#chatId').value = $('#chatSel').value; localStorage.setItem(KEY, $('#chatSel').value); loadList(); } });
$('#chatId').addEventListener('change', () => { localStorage.setItem(KEY, $('#chatId').value.trim()); loadList(); });
initChat().then(() => { renderPreview(); loadList(); });
</script>
</body>
</html>
