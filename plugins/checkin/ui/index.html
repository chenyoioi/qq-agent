<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>签到榜</title>
<style>
  :root { color-scheme: light dark; --bg:#f7f8fa; --card:#fff; --line:#e3e6ec; --text:#1f2329; --muted:#6b7280; --accent:#2f6fed; }
  @media (prefers-color-scheme: dark) { :root { --bg:#15171c; --card:#1d2027; --line:#2c313b; --text:#e6e8ec; --muted:#9aa3b2; --accent:#6ea0ff; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:18px; font:13px/1.55 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background:var(--bg); color:var(--text); }
  h2 { font-size:15px; margin:0 0 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  input, button { font:inherit; color:inherit; background:transparent; border:1px solid var(--line); border-radius:7px; padding:6px 9px; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  table { width:100%; border-collapse:collapse; margin-top:10px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-size:12px; }
  .muted { color:var(--muted); }
</style>
</head>
<body>
<div class="card">
  <div class="row" style="justify-content:space-between">
    <h2>签到榜</h2>
    <div class="row">
      <input id="chatId" placeholder="群号" style="width:140px" />
      <button id="refresh">刷新</button>
    </div>
  </div>
  <div class="muted" id="status">正在读取…</div>
  <table>
    <thead><tr><th>QQ</th><th>连签天数</th><th>最后签到</th><th>累计签到金币</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const KEY = 'checkin-panel-chat';
async function refresh() {
  const id = String($('#chatId').value || '').replace(/\D/g, '');
  localStorage.setItem(KEY, id);
  if (!id) { $('#status').textContent = '先填群号'; return; }
  $('#status').textContent = '读取中…';
  try {
    const r = await fetch('/api/plugin-ui/checkin/action', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ action: 'status', payload: { chatKey: `group:${id}` } })
    });
    const j = await r.json();
    if (!j.ok) { $('#status').textContent = '读取失败：' + (j.error || ''); return; }
    $('#rows').innerHTML = (j.rows || []).map((x) => `
      <tr><td>${esc(x.userId)}</td><td>${esc(x.streak)}</td><td class="muted">${esc(x.lastDate)}</td><td>${esc(x.total)}</td></tr>`).join('')
      || '<tr><td colspan="4" class="muted">还没有人签到</td></tr>';
    $('#status').textContent = `今天（业务日 ${j.today}）共 ${(j.rows || []).length} 人签过`;
  } catch (e) { $('#status').textContent = '读取失败：' + e.message; }
}
$('#refresh').addEventListener('click', refresh);
$('#chatId').value = localStorage.getItem(KEY) || '';
refresh();
</script>
</body>
</html>
